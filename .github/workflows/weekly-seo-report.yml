name: Weekly Search Console report

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbanfresh-export-weekly-search-console-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Search Console credential is configured
        shell: bash
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: |
          if [[ -z "$GSC_CREDENTIALS_JSON" ]]; then
            echo "::error::The GSC_CREDENTIALS_JSON repository secret is missing."
            exit 1
          fi

      - name: Generate read-only Search Console report
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: python3 scripts/seo_improver.py --output-root "${{ runner.temp }}/seo-report"

      - name: Upload report backup
        uses: actions/upload-artifact@v4
        with:
          name: urbanfreshrice-com-seo-report-${{ github.run_id }}
          path: ${{ runner.temp }}/seo-report
          if-no-files-found: error
          retention-days: 90
