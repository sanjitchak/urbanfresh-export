name: SEO quality

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbanfresh-export-seo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild generated site
        run: python3 scripts/build_site.py

      - name: Run SEO audit
        run: python3 scripts/seo_audit.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check generated files and patch quality
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
